name: Build Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-windows:
    name: Windows setup and MSI
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Build Windows package
        shell: powershell
        run: pnpm desktop:build:windows

      - name: Package optional ffmpeg component
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File scripts/package-ffmpeg-component.ps1

      - name: Collect Windows artifacts
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path release\windows | Out-Null
          Copy-Item -Force src-tauri\target\release\bundle\nsis\*.exe release\windows\
          Copy-Item -Force src-tauri\target\release\bundle\msi\*.msi release\windows\
          Copy-Item -Force release\components\MyWiki_ffmpeg_0.1.7_windows_x64.zip* release\windows\
          Get-FileHash -Algorithm SHA256 release\windows\* | ForEach-Object {
            "$($_.Hash)  $([System.IO.Path]::GetFileName($_.Path))"
          } | Set-Content release\windows\SHA256SUMS.txt

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mywiki-windows-x64
          path: release/windows/*
